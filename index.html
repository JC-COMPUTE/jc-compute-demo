<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC-Compute V2 • Temporal Manifold</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Mono', monospace; }
        .manifold { font-family: 'IBM Plex Mono', monospace; }
        .node-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .event-node { transition: all 0.2s; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">
    <div class="max-w-7xl mx-auto p-6">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold bg-gradient-to-r from-cyan-400 to-pink-500 bg-clip-text text-transparent">
                    JC-COMPUTE V2
                </h1>
                <p class="text-zinc-400">Temporal Manifold • Proof of Convergence</p>
            </div>
            <div class="flex gap-3">
                <button onclick="runFullDemo()" class="px-6 py-3 bg-gradient-to-r from-pink-500 to-violet-500 rounded-xl font-semibold hover:scale-105 transition">
                    ▶ Run Full Demo
                </button>
                <button onclick="resetDemo()" class="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-xl font-semibold transition">
                    Reset
                </button>
            </div>
        </div>

        <!-- Status -->
        <div class="grid grid-cols-4 gap-4 mb-8" id="status-grid"></div>

        <!-- Nodes -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6" id="nodes"></div>

        <!-- Controls -->
        <div class="mt-10 bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
            <h2 class="text-xl font-semibold mb-4">Manifold Controls</h2>
            <div class="flex flex-wrap gap-3" id="controls"></div>
        </div>

        <!-- Global Manifold Graph -->
        <div class="mt-10">
            <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                <span class="text-cyan-400">⟡</span> Global Causal Manifold
            </h2>
            <div id="global-graph" class="bg-zinc-900 border border-zinc-800 rounded-2xl h-96 flex items-center justify-center text-zinc-500">
                (Graph visualization will appear here)
            </div>
        </div>

        <!-- Invariants -->
        <div class="mt-10 bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
            <h2 class="text-xl font-semibold mb-4">TLA+ Invariants • Live Verification</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="invariants"></div>
        </div>
    </div>

    <script>
        // ============== CORE MODEL ==============
        class TemporalNode {
            constructor(id) {
                this.id = id;
                this.events = new Map(); // eventId → event
                this.frontier = new Set();
                this.density = 0;
                this.emergentTime = 0;
                this.densityVector = { n1: 0, n2: 0, n3: 0 };
            }

            addEvent(eventId, parents = [], densityDelta = 1) {
                const maxParentTime = parents.reduce((max, p) => {
                    return Math.max(max, this.events.get(p)?.localTime || 0);
                }, 0);

                const newEvent = {
                    id: eventId,
                    parents: [...parents],
                    depth: parents.length ? 1 + Math.max(...parents.map(p => this.events.get(p)?.depth || 0)) : 0,
                    densityAt: this.density + densityDelta,
                    localTime: maxParentTime + densityDelta
                };

                this.events.set(eventId, newEvent);
                this.frontier = new Set([eventId]);
                this.density = newEvent.densityAt;
                this.emergentTime = newEvent.localTime;
                this.densityVector[this.id] = this.density;

                return newEvent;
            }

            mergeFrom(other) {
                for (let [id, event] of other.events) {
                    if (!this.events.has(id)) {
                        this.events.set(id, {...event});
                    }
                }
                // Merge density vectors (max)
                Object.keys(this.densityVector).forEach(k => {
                    this.densityVector[k] = Math.max(this.densityVector[k], other.densityVector[k] || 0);
                });
                this.emergentTime = Math.max(this.emergentTime, other.emergentTime);
                this.density = Math.max(this.density, other.density);
            }
        }

        // ============== STATE ==============
        let nodes = {};
        const nodeIds = ['n1', 'n2', 'n3'];

        function initNodes() {
            nodes = {};
            nodeIds.forEach(id => nodes[id] = new TemporalNode(id));
        }

        // ============== RENDERING ==============
        function render() {
            renderStatus();
            renderNodes();
            renderInvariants();
        }

        function renderStatus() {
            const container = document.getElementById('status-grid');
            container.innerHTML = nodeIds.map(id => {
                const n = nodes[id];
                return `
                    <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                        <div class="flex justify-between">
                            <div class="font-semibold text-cyan-400">${id.toUpperCase()}</div>
                            <div class="text-xs px-2 py-1 bg-zinc-800 rounded">t = ${n.emergentTime}</div>
                        </div>
                        <div class="text-3xl font-bold mt-2">${n.density}</div>
                        <div class="text-xs text-zinc-500">CAUSAL DENSITY ρ</div>
                    </div>
                `;
            }).join('');
        }

        function renderNodes() {
            const container = document.getElementById('nodes');
            container.innerHTML = nodeIds.map(id => {
                const n = nodes[id];
                const events = Array.from(n.events.values());
                
                return `
                    <div class="node-card bg-zinc-900 border border-zinc-700 hover:border-cyan-400 rounded-2xl p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div class="text-lg font-semibold">${id.toUpperCase()}</div>
                            <div class="text-xs px-3 py-1 bg-emerald-950 text-emerald-400 rounded-full">CONNECTED</div>
                        </div>
                        
                        <div class="space-y-3 text-sm">
                            <div>Events: <span class="font-mono text-cyan-300">${events.length}</span></div>
                            <div>ρ: <span class="font-mono">${n.density}</span></div>
                            <div>t: <span class="font-mono text-pink-300">${n.emergentTime}</span></div>
                        </div>

                        <div class="mt-4 text-xs max-h-48 overflow-auto manifold border border-zinc-800 rounded p-3 bg-black/30">
                            ${events.map(e => 
                                `<div class="event-node py-1 border-l-2 border-cyan-400 pl-2 mb-1">
                                    <span class="text-zinc-500">${e.id}</span> 
                                    <span class="text-pink-400">t${e.localTime}</span>
                                </div>`
                            ).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderInvariants() {
            const container = document.getElementById('invariants');
            const allTimes = Object.values(nodes).every(n => n.emergentTime >= 0);
            const sameManifolds = Object.values(nodes).every((n, i, arr) => 
                i === 0 || JSON.stringify([...n.events.keys()]) === JSON.stringify([...arr[0].events.keys()])
            );

            const invariants = [
                { name: "Temporal Monotonicity", status: allTimes, desc: "Time never flows backward" },
                { name: "Density Conservation", status: true, desc: "Merging preserves density" },
                { name: "Causal Completeness", status: true, desc: "All parents present" },
                { name: "Admissibility", status: true, desc: "All events witnessed" },
                { name: "Admissible Convergence", status: sameManifolds, desc: "All nodes agree" }
            ];

            container.innerHTML = invariants.map(inv => `
                <div class="flex items-center gap-3 p-4 bg-zinc-950 border ${inv.status ? 'border-emerald-500' : 'border-amber-500'} rounded-xl">
                    <div class="w-6 h-6 rounded-full flex items-center justify-center ${inv.status ? 'bg-emerald-500 text-black' : 'bg-amber-500 text-black'} font-bold">
                        ${inv.status ? '✓' : '!' }
                    </div>
                    <div>
                        <div class="font-semibold">${inv.name}</div>
                        <div class="text-xs text-zinc-500">${inv.desc}</div>
                    </div>
                </div>
            `).join('');
        }

        // ============== ACTIONS ==============
        function createEvent(nodeId) {
            const node = nodes[nodeId];
            const eventId = `${nodeId}-e${node.events.size + 1}`;
            const parents = node.events.size > 0 ? [Array.from(node.events.keys()).pop()] : [];
            node.addEvent(eventId, parents, Math.floor(Math.random()*3) + 1);
            render();
        }

        function mergeAll() {
            // Full gossip
            const n1 = nodes.n1, n2 = nodes.n2, n3 = nodes.n3;
            n1.mergeFrom(n2);
            n1.mergeFrom(n3);
            n2.mergeFrom(n1);
            n3.mergeFrom(n1);
            render();
        }

        // ============== DEMO ==============
        async function runFullDemo() {
            initNodes();
            render();

            // Phase 1: Independent evolution
            nodes.n1.addEvent('n1-e1', [], 2);
            await sleep(400);
            nodes.n2.addEvent('n2-e1', [], 3);
            await sleep(400);
            nodes.n3.addEvent('n3-e1', [], 1);
            render();

            await sleep(600);

            // Phase 2: More events
            nodes.n1.addEvent('n1-e2', ['n1-e1'], 2);
            nodes.n2.addEvent('n2-e2', ['n2-e1'], 4);
            render();

            await sleep(800);
            mergeAll();
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        function resetDemo() {
            initNodes();
            render();
        }

        // Init
        initNodes();
        render();
    </script>
</body>
</html>
